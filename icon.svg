<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e293b"/>
            <stop offset="100%" stop-color="#0f172a"/>
        </linearGradient>
        <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#10b981"/>
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="15" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>
    <rect width="512" height="512" rx="120" fill="url(#bg)"/>
    
    <!-- Grid Background -->
    <path d="M 128 0 L 128 512 M 256 0 L 256 512 M 384 0 L 384 512 M 0 128 L 512 128 M 0 256 L 512 256 M 0 384 L 512 384" stroke="#334155" stroke-width="4" opacity="0.4"/>
    
    <!-- Glowing Trend Line Shadow -->
    <path d="M 100 380 L 220 250 L 320 300 L 420 120" fill="none" stroke="url(#lineGrad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity="0.5"/>
    
    <!-- Main Trend Line -->
    <path d="M 100 380 L 220 250 L 320 300 L 420 120" fill="none" stroke="url(#lineGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Data Points -->
    <circle cx="100" cy="380" r="24" fill="#3b82f6"/>
    <circle cx="420" cy="120" r="24" fill="#10b981"/>
</svg>
